# HAProxy Lua DNSBL - Basic Configuration Example
#
# This is a minimal working configuration that demonstrates
# DNSBL-based blocking of Tor exit nodes.
#
# Usage:
#   haproxy -f haproxy.cfg

global
    log stdout format raw local0 info

    # Load the DNSBL Lua module
    # Adjust the path to match your installation
    lua-load /usr/share/lua/5.3/dnsbl.lua

defaults
    log global
    mode http
    option httplog

    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Stick-table backend for caching DNSBL results
#
# - type ipv6: Supports both IPv4 and IPv6 addresses
# - size 1m: Cache up to 1 million IP addresses
# - expire 30m: Cache entries expire after 30 minutes
# - store gpc0,gpc1: gpc0=allowed, gpc1=blocked
backend st_dnsbl_cache
    stick-table type ipv6 size 1m expire 30m store gpc0,gpc1

# Your backend servers
backend webservers
    balance roundrobin
    server web1 127.0.0.1:8080 check

# Main frontend with DNSBL protection
frontend http-in
    bind *:80

    # Step 1: Track the source IP in the stick-table
    # This MUST come before dnsbl_query
    http-request track-sc0 src table st_dnsbl_cache

    # Step 2: Perform DNSBL lookup
    # Parameters:
    #   1. st_dnsbl_cache - Backend with stick-table
    #   2. .torexit.dan.me.uk - DNSBL domain to query
    #   3. "" - No custom variable for IP (empty)
    #   4. "" - No header for IP (empty, use direct connection)
    http-request lua.dnsbl_query st_dnsbl_cache .torexit.dan.me.uk "" ""

    # Step 3: Block requests from blacklisted IPs
    http-request lua.dnsbl_block st_dnsbl_cache

    # Route allowed requests to backend
    default_backend webservers
