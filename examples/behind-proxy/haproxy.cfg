# HAProxy Lua DNSBL - Behind Proxy Configuration
#
# This configuration is for when HAProxy sits behind another
# reverse proxy (nginx, CDN, load balancer, etc.) and needs
# to extract the real client IP from a header.
#
# Common scenarios:
# - Behind nginx with proxy_set_header X-Forwarded-For
# - Behind AWS ALB/ELB
# - Behind Cloudflare
# - Behind any CDN

global
    log stdout format raw local0 info
    lua-load /usr/share/lua/5.3/dnsbl.lua

defaults
    log global
    mode http
    option httplog
    option forwardfor

    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Stick-table for caching
backend st_dnsbl_cache
    stick-table type ipv6 size 1m expire 30m store gpc0,gpc1

# Backend servers
backend webservers
    balance roundrobin
    server web1 127.0.0.1:8080 check

# Frontend - Using X-Forwarded-For Header
frontend http-in
    bind *:80

    # Option 1: Simple - Get first IP from X-Forwarded-For
    # Track the header value in stick-table
    http-request track-sc0 hdr(X-Forwarded-For) table st_dnsbl_cache

    # Use the header for DNSBL lookup
    http-request lua.dnsbl_query st_dnsbl_cache .torexit.dan.me.uk "" X-Forwarded-For

    http-request lua.dnsbl_block st_dnsbl_cache

    default_backend webservers


# Alternative Frontend - Using X-Real-IP Header
# (Common with nginx)
frontend http-in-realip
    bind *:8081

    http-request track-sc0 hdr(X-Real-IP) table st_dnsbl_cache

    http-request lua.dnsbl_query st_dnsbl_cache .torexit.dan.me.uk "" X-Real-IP

    http-request lua.dnsbl_block st_dnsbl_cache

    default_backend webservers


# Alternative Frontend - Handle Multiple IPs in X-Forwarded-For
# When there are multiple proxies: "client, proxy1, proxy2"
frontend http-in-multi-proxy
    bind *:8082

    # Extract only the first (leftmost) IP from X-Forwarded-For
    http-request set-var(txn.real_ip) hdr(X-Forwarded-For),word(1,",")

    # Track the extracted IP
    http-request track-sc0 var(txn.real_ip) table st_dnsbl_cache

    # Use the variable for lookup
    http-request lua.dnsbl_query st_dnsbl_cache .torexit.dan.me.uk txn.real_ip ""

    http-request lua.dnsbl_block st_dnsbl_cache

    default_backend webservers


# Alternative Frontend - Cloudflare with CF-Connecting-IP
frontend http-in-cloudflare
    bind *:8083

    # Cloudflare uses CF-Connecting-IP for the real client IP
    http-request track-sc0 hdr(CF-Connecting-IP) table st_dnsbl_cache

    http-request lua.dnsbl_query st_dnsbl_cache .torexit.dan.me.uk "" CF-Connecting-IP

    http-request lua.dnsbl_block st_dnsbl_cache

    default_backend webservers
