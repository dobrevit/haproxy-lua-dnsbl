# HAProxy Lua DNSBL - Docker Example Configuration
#
# This configuration is designed for the Docker example environment.

global
    log stdout format raw local0 info

    # Load the DNSBL Lua module
    lua-load /usr/share/lua/5.3/dnsbl.lua

    # Stats socket for debugging
    stats socket /var/run/haproxy/admin.sock mode 660 level admin

defaults
    log global
    mode http
    option httplog
    option forwardfor

    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Stick-table for caching DNSBL results
backend st_dnsbl_cache
    stick-table type ipv6 size 100k expire 30m store gpc0,gpc1

# Backend servers (nginx container)
backend webservers
    balance roundrobin
    server backend backend:80 check

# Main frontend with DNSBL protection
frontend http-in
    bind *:80

    # Track source IP in stick-table
    # Using X-Forwarded-For for when behind another proxy
    http-request set-var(txn.client_ip) hdr(X-Forwarded-For),word(1,",") if { hdr(X-Forwarded-For) -m found }
    http-request set-var(txn.client_ip) src if !{ var(txn.client_ip) -m found }

    http-request track-sc0 var(txn.client_ip) table st_dnsbl_cache

    # DNSBL lookup using Tor exit list
    http-request lua.dnsbl_query st_dnsbl_cache .torexit.dan.me.uk txn.client_ip ""

    # Block blacklisted IPs
    http-request lua.dnsbl_block st_dnsbl_cache

    # Custom log format with DNSBL info
    log-format "%ci [%t] %ft %b/%s %ST %B %r dnsbl:%[req.hdr(X-DNSBL-Action)] ip:%[req.hdr(X-DNSBL-Client-IP)]"

    default_backend webservers

# Stats page (optional, for debugging)
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
