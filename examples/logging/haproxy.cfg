# HAProxy Lua DNSBL - Logging Configuration
#
# This configuration demonstrates how to log DNSBL decisions
# and create useful log formats for monitoring and analysis.

global
    log stdout format raw local0 info
    lua-load /usr/share/lua/5.3/dnsbl.lua

defaults
    log global
    mode http
    option httplog

    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Stick-table for caching
backend st_dnsbl_cache
    stick-table type ipv6 size 1m expire 30m store gpc0,gpc1

# Backend servers
backend webservers
    balance roundrobin
    server web1 127.0.0.1:8080 check

# Frontend with comprehensive logging
frontend http-in
    bind *:80

    http-request track-sc0 src table st_dnsbl_cache
    http-request lua.dnsbl_query st_dnsbl_cache .torexit.dan.me.uk "" ""
    http-request lua.dnsbl_block st_dnsbl_cache

    # Custom log format with DNSBL information
    # Available variables from DNSBL headers:
    # - %[req.hdr(X-DNSBL-Action)] - CACHE-ALLOW, LOOKUP-DENY, etc.
    # - %[req.hdr(X-DNSBL-Is-Allowed)] - 1 or 0
    # - %[req.hdr(X-DNSBL-Client-IP)] - IP that was checked
    # - %[req.hdr(X-DNSBL-Query)] - DNS query made

    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r dnsbl_action:%[req.hdr(X-DNSBL-Action)] dnsbl_ip:%[req.hdr(X-DNSBL-Client-IP)] dnsbl_allowed:%[req.hdr(X-DNSBL-Is-Allowed)]"

    default_backend webservers


# Alternative: JSON log format for structured logging
frontend http-in-json
    bind *:8081

    http-request track-sc0 src table st_dnsbl_cache
    http-request lua.dnsbl_query st_dnsbl_cache .torexit.dan.me.uk "" ""
    http-request lua.dnsbl_block st_dnsbl_cache

    # JSON log format for log aggregators (ELK, Splunk, etc.)
    log-format '{"timestamp":"%t","client_ip":"%ci","client_port":%cp,"frontend":"%ft","backend":"%b","server":"%s","status":%ST,"bytes":%B,"request":"%r","user_agent":"%[req.hdr(User-Agent)]","dnsbl":{"action":"%[req.hdr(X-DNSBL-Action)]","client_ip":"%[req.hdr(X-DNSBL-Client-IP)]","allowed":"%[req.hdr(X-DNSBL-Is-Allowed)]","query":"%[req.hdr(X-DNSBL-Query)]"}}'

    default_backend webservers


# Alternative: Minimal log format focusing on DNSBL
frontend http-in-minimal
    bind *:8082

    http-request track-sc0 src table st_dnsbl_cache
    http-request lua.dnsbl_query st_dnsbl_cache .torexit.dan.me.uk "" ""
    http-request lua.dnsbl_block st_dnsbl_cache

    # Simple format: timestamp, IP, action, request
    log-format "[%t] %[req.hdr(X-DNSBL-Client-IP)] %[req.hdr(X-DNSBL-Action)] %r"

    default_backend webservers


# Alternative: Separate log for DNSBL events only
frontend http-in-separate-log
    bind *:8083

    http-request track-sc0 src table st_dnsbl_cache
    http-request lua.dnsbl_query st_dnsbl_cache .torexit.dan.me.uk "" ""

    # ACL to detect blocked requests
    acl dnsbl_denied req.hdr(X-DNSBL-Action) -m sub DENY

    # Log DENY events to a separate log
    http-request set-var(txn.log_dnsbl) str(1) if dnsbl_denied

    http-request lua.dnsbl_block st_dnsbl_cache

    # Standard log format
    log-format "%ci:%cp [%t] %ft %b/%s %ST %B %r"

    default_backend webservers
