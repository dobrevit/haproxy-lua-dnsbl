# HAProxy Lua DNSBL - Multiple DNSBL Providers Configuration
#
# This configuration demonstrates using multiple DNSBL providers
# to check IPs against different blacklists.
#
# Providers used:
# - dan.me.uk Tor exit list
# - Tor Project exit list
# - Spamhaus XBL (exploit sources)

global
    log stdout format raw local0 info
    lua-load /usr/share/lua/5.3/dnsbl.lua

defaults
    log global
    mode http
    option httplog

    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Separate stick-tables for each DNSBL provider
# This allows different cache policies per provider
backend st_tor_dan
    stick-table type ipv6 size 500k expire 1h store gpc0,gpc1

backend st_tor_project
    stick-table type ipv6 size 500k expire 1h store gpc0,gpc1

backend st_spamhaus
    stick-table type ipv6 size 1m expire 30m store gpc0,gpc1

# Backend servers
backend webservers
    balance roundrobin
    server web1 127.0.0.1:8080 check

# Frontend checking all DNSBL providers
frontend http-in
    bind *:80

    # Track IPs in all stick-tables
    # Using different track-sc indices for each table
    http-request track-sc0 src table st_tor_dan
    http-request track-sc1 src table st_tor_project
    http-request track-sc2 src table st_spamhaus

    # Check all DNSBL providers
    # IMPORTANT: sc_index parameter must match the track-sc index for each table
    http-request lua.dnsbl_query st_tor_dan .torexit.dan.me.uk "" "" 0
    http-request lua.dnsbl_query st_tor_project .exitlist.torproject.org "" "" 1
    http-request lua.dnsbl_query st_spamhaus xbl.spamhaus.org "" "" 2

    # Block if any DNSBL matched
    # Note: This checks all tables sequentially
    http-request lua.dnsbl_block st_tor_dan
    http-request lua.dnsbl_block st_tor_project
    http-request lua.dnsbl_block st_spamhaus

    default_backend webservers


# Alternative: Block only Tor, log but allow Spamhaus matches
frontend http-in-tor-only
    bind *:8081

    http-request track-sc0 src table st_tor_dan
    http-request track-sc1 src table st_spamhaus

    # sc_index must match track-sc index
    http-request lua.dnsbl_query st_tor_dan .torexit.dan.me.uk "" "" 0
    http-request lua.dnsbl_query st_spamhaus xbl.spamhaus.org "" "" 1

    # Only block Tor exit nodes
    http-request lua.dnsbl_block st_tor_dan

    # Spamhaus matches are logged but not blocked
    # (headers will show DNSBL-LOOKUP-DENY for Spamhaus matches)

    default_backend webservers


# Alternative: Use ACLs for custom blocking logic
frontend http-in-acl
    bind *:8082

    http-request track-sc0 src table st_tor_dan
    http-request track-sc1 src table st_spamhaus

    # sc_index must match track-sc index
    http-request lua.dnsbl_query st_tor_dan .torexit.dan.me.uk "" "" 0
    http-request lua.dnsbl_query st_spamhaus xbl.spamhaus.org "" "" 1

    # Define ACLs based on DNSBL results
    acl is_tor_exit req.hdr(X-DNSBL-Action) -m sub DENY

    # Custom handling: redirect Tor users to a different page
    http-request redirect location /tor-detected.html if is_tor_exit

    default_backend webservers


# Alternative: Single stick-table, multiple DNSBLs (simpler but less granular)
frontend http-in-simple
    bind *:8083

    http-request track-sc0 src table st_tor_dan

    # Multiple queries, same stick-table
    # Note: Results will overwrite each other in the cache
    # Last lookup result is what gets cached
    http-request lua.dnsbl_query st_tor_dan .torexit.dan.me.uk "" ""
    http-request lua.dnsbl_query st_tor_dan xbl.spamhaus.org "" ""

    http-request lua.dnsbl_block st_tor_dan

    default_backend webservers
